name: Test FMP access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Test FMP key and endpoint entitlements
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/test_fmp.py
