name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

      # index.html is edited by string replacement; a missing comma between row
      # objects breaks the page silently. This parses it and renders every
      # engine view plus every ticker detail page.
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/check_html.js index.html
