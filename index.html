<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartTrades.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12162A; --surf:#191F38; --surf2:#1F2745; --line:#2A3358; --line2:#374372;
  --txt:#E9E6DC; --mut:#828CB0; --dim:#5C6690;
  --dp:#8B7BF0; --dv:#4FC08D; --rc:#E8A13A; --uv:#4A9EE8; --pol:#E06C9F; --btc:#35C9D4; --rec:#B8C94A;
  --neg:#E4626F; --pos:#4FC08D;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--acc,#8B7BF0);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:20px 18px 18px;border-bottom:1px solid var(--line)}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
.brand h1 span{color:var(--dp)}
.brand p{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.35}

.nav{padding:10px 0;flex:1}
.nav button{
  display:block;width:100%;text-align:left;padding:11px 18px 11px 15px;
  border-left:3px solid transparent;color:var(--mut);position:relative;
}
.nav button .t{font-size:13.5px;font-weight:500;display:block}
.nav button .s{font-size:11px;color:var(--dim);display:block;margin-top:1px}
.nav button:hover{background:var(--surf2);color:var(--txt)}
.nav button[aria-current="true"]{background:var(--surf2);color:var(--txt);border-left-color:var(--c)}
.nav button[aria-current="true"] .t{color:var(--c)}
.railfoot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);line-height:1.5}

/* ---------- tape ---------- */
.tape{
  display:grid;grid-template-columns:repeat(8,1fr);
  border-bottom:1px solid var(--line);background:var(--surf);
}
.tp{padding:12px 11px;border-right:1px solid var(--line);position:relative;overflow:hidden}
.tp:last-child{border-right:none}
.tp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c)}
.tp .lbl{font-size:10.5px;color:var(--dim);letter-spacing:.01em}
.tp .tk{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.tp .sc{font-size:11.5px;color:var(--c);margin-left:7px;font-weight:500}
.tp .why{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.35}

/* ---------- main ---------- */
main{min-width:0}
.head{padding:22px 26px 16px;border-bottom:1px solid var(--line)}
.head h2{font-size:23px;font-weight:600;letter-spacing:-.025em;color:var(--c)}
.head .thesis{font-size:13.5px;color:var(--mut);margin-top:6px;max-width:74ch;line-height:1.55}
.method{
  margin-top:13px;padding:10px 13px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);font-size:12px;color:var(--mut);max-width:78ch;line-height:1.55;
}
.method b{color:var(--txt);font-weight:600}

/* ---------- controls ---------- */
.ctrls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--surf)}
.ctrl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.ctrl input[type=range]{width:104px;accent-color:var(--c)}
.ctrl input[type=search]{
  background:var(--bg);border:1px solid var(--line);color:var(--txt);
  padding:6px 9px;border-radius:var(--r);width:130px;font-size:12.5px;
}
.ctrl .v{color:var(--c);font-weight:600;min-width:24px}
.pill{margin-left:auto;font-size:11px;color:var(--dim)}

/* ---------- leaderboard (politician tab) ---------- */
.lb{padding:16px 26px 18px;border-bottom:1px solid var(--line)}
.lbh{font-size:11px;color:var(--dim);margin-bottom:9px}
.lbscroll{overflow-x:auto}
.lbgrid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);min-width:720px}
.lbr{display:grid;grid-template-columns:26px 1.7fr 1.5fr .8fr .8fr .6fr .6fr .7fr;gap:12px;
     background:var(--bg);padding:9px 13px;align-items:center;font-size:12.5px}
.lbr.hd{background:var(--surf);color:var(--dim);font-size:10.5px;padding:8px 13px}
.lbr .rk{color:var(--dim)}
.lbr .mn{font-weight:600}
.lbr .cm{font-size:11.5px;color:var(--mut)}
.lbnote{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.55;max-width:80ch}

/* ---------- charts ---------- */
.chart{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);
       padding:14px 16px 10px;margin-bottom:14px}
.chart h4{font-size:13px;font-weight:600;margin-bottom:2px}
.chart .cap{font-size:11.5px;color:var(--dim);margin-bottom:10px;line-height:1.5;max-width:78ch}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.axl{fill:var(--dim);font-size:9.5px;font-family:'IBM Plex Mono',monospace}
.pl{fill:none;stroke-width:1.6}
.zone{fill:var(--neg);opacity:.07}
.dv{stroke-dasharray:4 3;stroke-width:1.3;fill:none}
.pin{font-size:9.5px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}

/* ---------- ticker detail page ---------- */
.tkpage{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
        animation:tkin .16s ease}
@keyframes tkin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tkpage{animation:none}}
.tkbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;
       padding:14px 26px;background:var(--surf);border-bottom:1px solid var(--line)}
.tkbar .bk{font-size:12.5px;color:var(--mut);border:1px solid var(--line2);
           padding:5px 11px;border-radius:var(--r)}
.tkbar .bk:hover{color:var(--txt);border-color:var(--c)}
.tkbar h2{font-size:20px;font-weight:600;letter-spacing:-.025em}
.tkbar .co2{font-size:12px;color:var(--dim)}
.tkbar .pxq{margin-left:auto;text-align:right}
.tkbar .pxq .p{font-size:19px;font-weight:600}
.tkbar .pxq .s{font-size:11px;color:var(--dim)}
.tkbody{padding:20px 26px 40px;max-width:1180px}
.flags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.flag{font-size:10.5px;padding:3px 9px;border-radius:2px;border:1px solid}

.cases{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.case{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);overflow:hidden}
.case h3{font-size:13px;font-weight:600;padding:11px 15px;border-bottom:1px solid var(--line)}
.case .cb{padding:13px 15px}
.case p{font-size:12.5px;color:var(--mut);line-height:1.6;margin-bottom:11px}
.case p b{color:var(--txt)}
.trg{font-size:10.5px;color:var(--dim);margin:12px 0 7px;letter-spacing:.02em}
.trow{display:grid;grid-template-columns:15px 1fr;gap:9px;font-size:12px;
      color:var(--mut);line-height:1.5;margin-bottom:7px}
.trow i{font-style:normal;font-weight:600}

.ladder{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.lrow{display:grid;grid-template-columns:104px 96px 74px 1fr;gap:14px;align-items:start;
      padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surf)}
.lrow:last-child{border-bottom:none}
.lrow .lt{font-size:12.5px;font-weight:600}
.lrow .lp{font-size:15px;font-weight:600}
.lrow .lg{font-size:12px}
.lrow .ln{font-size:11.5px;color:var(--mut);line-height:1.5}
.lstat{font-size:10px;padding:2px 6px;border-radius:2px;border:1px solid;margin-left:6px}
.warnbox{border:1px solid var(--neg);border-left-width:3px;border-radius:var(--r);
         padding:11px 14px;margin-top:9px;font-size:11.5px;color:var(--mut);line-height:1.55}
.warnbox b{color:var(--neg)}

.ipanel{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px;margin-bottom:20px}
.ig{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:13px 15px}
.ig h4{font-size:12.5px;font-weight:600;margin-bottom:2px}
.ig .iw{font-size:10.5px;color:var(--dim);margin-bottom:11px}
.irow{display:flex;justify-content:space-between;align-items:baseline;
      font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.irow .in{color:var(--mut)}
.irow .iv2{font-weight:600}
.corrbox{border:1px solid var(--line2);border-radius:var(--r);padding:11px 14px;
         font-size:11.5px;color:var(--mut);line-height:1.6;margin-bottom:20px}
.corrbox b{color:var(--txt)}
.news{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.nrow{padding:11px 15px;border-bottom:1px solid var(--line);background:var(--surf)}
.nrow:last-child{border-bottom:none}
.nrow .nh{font-size:12.5px;line-height:1.45}
.nrow .nm{font-size:11px;color:var(--dim);margin-top:3px}
.sec{font-size:11px;color:var(--dim);margin:24px 0 9px;letter-spacing:.02em}
.sec:first-child{margin-top:0}
@media (max-width:900px){
  .cases,.ipanel{grid-template-columns:1fr}
  .lrow{grid-template-columns:1fr 1fr;gap:8px}
  .tkbody,.tkbar{padding-left:16px;padding-right:16px}
}

/* ---------- divergence gauge ---------- */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.dgc{background:var(--bg);padding:15px 16px}
.dgc .k{font-size:10.5px;color:var(--dim)}
.dgc .n{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:3px 0 2px}
.dgc .d{font-size:11.5px;color:var(--mut);line-height:1.45}
.dgbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:9px}
.dgbar span{display:block;height:100%;border-radius:4px}
.gap{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r);
     padding:13px 16px;margin-bottom:22px;background:var(--surf)}
.gap .gh{font-size:11px;color:var(--dim);margin-bottom:5px}
.gap .gt{font-size:13px;line-height:1.6;color:var(--mut);max-width:84ch}
.gap .gt b{color:var(--txt)}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:1px;
     background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px}
.ic{background:var(--bg);padding:11px 13px}
.ic .il{font-size:10.5px;color:var(--dim)}
.ic .iv{font-size:17px;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.ic .is{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.4}
.ic .tag{margin-top:6px}

/* ---------- bitcoin page ---------- */
.btcwrap{padding:20px 26px 28px}
.regime{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
        background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin-bottom:24px}
.rg{background:var(--bg);padding:12px 14px}
.rg .l{font-size:10.5px;color:var(--dim)}
.rg .v{font-size:20px;font-weight:600;margin-top:3px;letter-spacing:-.025em}
.rg .s{font-size:11px;color:var(--mut);margin-top:2px}

.clock{margin-bottom:26px}
.ch{font-size:11px;color:var(--dim);margin-bottom:9px}
.ctrack{position:relative;height:36px;background:var(--surf);border:1px solid var(--line);
        border-radius:var(--r);overflow:hidden}
.cfill{position:absolute;left:0;top:0;bottom:0}
.mark{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.mark.now{width:2px}
.mark.zone{width:auto;background:rgba(232,161,58,.16);border-left:1px dashed var(--rc);border-right:1px dashed var(--rc)}
.clabels{position:relative;height:46px;margin-top:7px}
.ml{position:absolute;font-size:10.5px;color:var(--dim);transform:translateX(-50%);
    text-align:center;line-height:1.4;width:112px}
.ml b{display:block;color:var(--mut);font-weight:600;font-size:11px}

.alerts{display:flex;flex-direction:column;gap:14px}
.al{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);overflow:hidden}
.alh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.alh h3{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.st{font-size:10.5px;padding:3px 8px;border-radius:2px;border:1px solid;margin-left:auto;white-space:nowrap}
.alb{padding:14px 16px}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:13px;margin-bottom:14px}
.rd{border-left:2px solid var(--line2);padding-left:10px}
.rd .l{font-size:10.5px;color:var(--dim)}
.rd .v{font-size:15px;font-weight:600;margin-top:2px}
.rd .t{font-size:11px;color:var(--mut);margin-top:1px}
.rule{font-size:12.5px;color:var(--mut);line-height:1.65;max-width:82ch}
.rule b{color:var(--txt);font-weight:600}
.rule p{margin-bottom:8px}
.rule p:last-child{margin-bottom:0}

/* ---------- table ---------- */
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:940px}
thead th{
  position:sticky;top:0;background:var(--bg);z-index:2;
  font-size:11px;font-weight:500;color:var(--dim);text-align:right;
  padding:11px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;
}
thead th:first-child,thead th:nth-child(2){text-align:left}
thead th:hover{color:var(--txt)}
thead th .ar{color:var(--c);font-size:9px}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr:hover{background:var(--surf)}
tbody tr.open{background:var(--surf2)}
td{padding:11px 12px;text-align:right;white-space:nowrap;font-size:13px}
td:first-child,td:nth-child(2){text-align:left}
.tk{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.co{font-size:11.5px;color:var(--dim);margin-top:1px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--pos)}.negv{color:var(--neg)}

/* segmented score meter — the core visual language */
.meter{display:inline-flex;gap:1.5px;vertical-align:middle;margin-right:8px}
.meter i{width:4px;height:13px;background:var(--line2);border-radius:1px;display:block}
.meter i.on{background:var(--c)}
.scv{font-weight:600;font-size:13px}

.tag{
  display:inline-block;font-size:10.5px;padding:2px 6px;border-radius:2px;
  border:1px solid var(--line2);color:var(--mut);
}
.tag.hot{border-color:var(--c);color:var(--c)}
.tag.warn{border-color:var(--neg);color:var(--neg)}

/* ---------- detail ---------- */
.det td{padding:0}
.detin{padding:18px 22px 22px;border-left:3px solid var(--c);background:var(--bg)}
.detgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:26px}
.dh{font-size:11px;color:var(--dim);margin-bottom:10px}
.brk{display:flex;flex-direction:column;gap:9px}
.brkrow{display:grid;grid-template-columns:150px 1fr 46px;gap:11px;align-items:center;font-size:12.5px}
.brkrow .bl{color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c);border-radius:3px}
.brkrow .bv{text-align:right;color:var(--txt);font-size:12px;font-weight:500}
.notes{font-size:12.5px;color:var(--mut);line-height:1.65}
.notes p{margin-bottom:9px}
.notes b{color:var(--txt);font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin-top:13px}
.fact{background:var(--bg);padding:8px 11px}
.fact .fl{font-size:10.5px;color:var(--dim)}
.fact .fv{font-size:13px;font-weight:600;margin-top:2px}

.empty{padding:50px 26px;color:var(--dim);font-size:13px}

/* ---------- data provenance ----------
   A reader must never need the footer to know whether a number is real. */
.srcban{margin:0 0 14px;padding:11px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.5;
  border:1px solid var(--line2);background:var(--surf2);color:var(--txt)}
.srcban b.k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;margin-right:8px}
/* Sample and no-data banners stay in view while the tab scrolls. */
#srcbar{position:sticky;top:0;z-index:20;padding:10px 26px 0;background:var(--bg)}
#srcbar .srcban{margin:0 0 10px}
#srcbar:has(.srcban.sample,.srcban.failed) .srcban{box-shadow:0 6px 14px rgba(0,0,0,.35)}
#srcbar:has(.srcban.live,.srcban.stale){position:static}
#custom.sample :is(.chart,.dgc,.ic,.rg,.al,.gap,.clock){position:relative}
#custom.sample :is(.chart,.dgc,.ic,.rg,.al,.gap)::after{content:"SAMPLE";position:absolute;top:6px;right:8px;
  padding:0 5px;border:1px solid #E4626F;border-radius:2px;color:#FF8A95;background:var(--bg);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;pointer-events:none}
.srcban.sample{border-color:#E4626F;color:#F4D5D8;
  background:repeating-linear-gradient(135deg,#3A1F2B 0 12px,#33192A 12px 24px)}
.srcban.sample b.k{color:#FF8A95}
.srcban.stale{border-color:var(--rc);background:#2E2716}
.srcban.stale b.k{color:var(--rc)}
.srcban.failed{border-color:var(--neg);background:#2A1A22}
.srcban.failed b.k{color:var(--neg)}
.srcban.live b.k{color:var(--pos)}
.srcban .det{display:block;margin-top:5px;color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  white-space:pre-wrap;word-break:break-word}
.agebar{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mut);margin:8px 0 0}
.nostate{padding:46px 26px;font-size:13.5px;color:var(--mut);line-height:1.6;max-width:80ch}
.nostate h3{font-size:15px;color:var(--txt);margin-bottom:6px}
.nostate .det{display:block;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);
  white-space:pre-wrap;word-break:break-word}
tr.samplerow td{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(228,98,111,.07) 10px 20px)}
.smark{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid #E4626F;border-radius:2px;
  color:#FF8A95;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;vertical-align:2px}
.nav button .st{float:right;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em;
  padding:0 4px;border:1px solid currentColor;border-radius:2px;margin-top:3px}
.st-live{color:var(--pos)} .st-stale{color:var(--rc)} .st-failed{color:var(--neg)}
.st-sample{color:#FF8A95} .st-none{color:var(--dim)}

.foot{padding:20px 26px 34px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1.65;max-width:88ch}
.foot b{color:var(--mut)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{border-right:none;border-bottom:1px solid var(--line)}
  .nav{display:grid;grid-template-columns:1fr 1fr;padding:0}
  .nav button{border-left:none;border-bottom:3px solid transparent;padding:10px 14px}
  .nav button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--c)}
  .railfoot{display:none}
  .tape{grid-template-columns:1fr 1fr}
  .tp:nth-child(even){border-right:none}
  .tp:nth-child(-n+4){border-bottom:1px solid var(--line)}

      rule:"<p><b>One clarification on the setup.</b> The oversold print is the <i>anchor</i> that opens the sequence, not where the divergence appears. Divergence forms later, at the highs of pushes 2 and 3, where price makes a higher high and RSI does not follow. The detector works that way: find a weekly RSI under 30, then track each subsequent price high against its matching RSI high.</p><p><b>It caught the top.</b> Running the detector across the last cycle produces a textbook result. Push 1 in January 2025 at $104,000 with RSI 89.9. Push 2 in July at $118,000 — price up 13.5%, RSI down to 77.7, a warning. Push 3 on 5 October at $126,296 — price up 21.4% from push 1, RSI still at 78.0. That completed the three-drives pattern, and it marked the cycle high to the week. The chart above shows both connector lines: price climbing, RSI falling.</p><p><b>Current sequence.</b> The anchor set at the February 2026 low with weekly RSI at 20.1, deeply oversold. Push 1 topped on 26 April at $81,400 with RSI 47.3. Because push 1 never reached the 65 strength floor, this sequence is running below the threshold where divergence means much — there was not enough momentum for its decay to signify anything. The August high near $81,900 is likely push 2 but is not yet confirmed; a local high needs four subsequent weekly closes before the detector will label it.</p><p><b>Known limitation:</b> divergence can persist for months in a strong trend. It marked the 2021 and 2025 tops well and gave repeated false warnings through 2017. It is a warning to tighten risk, not a timing tool.</p>"
    },
    {
      title:"Daily RSI entry timing",
      status:"Neutral — 21 points from oversold", stype:"watch",
      reads:[
        {l:"Daily RSI(14)",   v:"51.2",  t:"neutral, mid-band"},
        {l:"Active band",     v:"30 / 65", t:"bear regime — shifts to 40 / 80 in a bull", hit:true},
        {l:"Last divergence", v:"5\u201330 Jun", t:"price -7.6%, RSI +1.4", hit:true},
        {l:"Raw signal record", v:"6 of 7", t:"since the cycle peak, 30d forward"}
      ],
      rule:"<p><b>The daily is the timing chart, and you are right that it is the more useful of the two — but only once it is filtered.</b> Weekly RSI fires two or three times a cycle, which is too rarely to time an entry. Daily fires often enough to be actionable and often enough to be dangerous.</p><p><b>Fixed 30/70 is the wrong threshold.</b> RSI does not oscillate around the same centre in every regime. In an uptrend it tends to live between 40 and 80 and finds support near 40\u201350; in a downtrend it lives between 20 and 60 and meets resistance near 55\u201365. A fixed 30 line under-fires in bull markets, where price bottoms at RSI 40 and you simply never get a signal, and over-fires in bear markets, where 30 prints repeatedly all the way down. The bands adapt to the regime instead. Right now the bear band is active, so oversold means 30 rather than 40.</p><p><b>What the record actually shows.</b> Seven oversold prints since the October peak. Six were higher 30 days later, averaging around +13%. One lost 14.7% — and it is worth being precise about which one, because the pattern is not random: it fired on 1 November 2025, three weeks after the all-time high, at $101,510. The failures cluster early in a downtrend, before the trend has exhausted itself. That is the entire argument for the weekly gate.</p><p><b>The confluence rule.</b> Weekly grants permission, daily pulls the trigger. Permission needs a confirmed weekly regime, weekly RSI under 70, and price at or above the support band. The trigger needs daily RSI below the adaptive oversold line, plus either two consecutive days under it or a bullish divergence. Currently <b>gated</b> — the weekly regime is unconfirmed, and daily RSI at 51.2 is 21 points from oversold in any case.</p><p><b>Bullish divergence</b> is the buy-side mirror of the three-push pattern: price makes a lower low while RSI makes a higher low, meaning selling pressure is decaying into new lows. The detector found one from 5 to 30 June — price fell 7.6% to a new low while RSI rose 1.4 points. It preceded the run to $81,900 in August.</p>"
    },
    {
            title:"Bull-market dip buy",
      status:"Gated — 3 of 4 regime checks pass", stype:"gated",
      reads:[
        {l:"Regime gate",    v:"Fails on 1",  t:"drawdown -38.7%, needs > -25%"},
        {l:"Band touch",     v:"+2.0%",       t:"$73.9k–75.9k, within tolerance", hit:true},
        {l:"STH-MVRV",       v:"1.04",        t:"needs \u2264 1.00 — not met"},
        {l:"Weekly RSI",     v:"51.1",        t:"inside the 45\u201360 reset zone", hit:true}
      ],
      rule:"<p><b>There is no single most accurate signal, and anyone claiming one is fitting three cycles.</b> What holds up best across those three is a confluence of two measures rather than either alone:</p><p><b>1. The bull market support band</b> — the 20-week SMA and 21-week EMA. In an uptrend price repeatedly dips into this band and bounces; a weekly close below has historically marked the loss of bullish momentum. Every major correction in the 2017 and 2021 bull runs found support here.</p><p><b>2. Short-term holder MVRV at or below 1.0</b> — the cost basis of everyone who bought within the last 155 days. At 1.0 the marginal recent buyer is exactly breakeven, a level that acts as support in uptrends and resistance in downtrends.</p><p>One measures price structure, the other holder positioning. They fail in different ways, which is the only reason combining them helps. The chart above circles the three historical instances where both lined up.</p><p><b>The rule:</b> in a confirmed bull regime, buy when price touches the band <i>and</i> STH-MVRV is at or under 1.0, confirmed by a weekly close back above the band. Invalidate on two consecutive weekly closes below it.</p><p><b>Why it is gated.</b> Three of the four regime checks now pass — price is above the band, the band has turned up (+0.6% over five weeks), and there have been four consecutive weekly closes above it. The fourth fails: price is still 38.7% below the all-time high, which makes this a recovery rather than a confirmed bull market. On the entry conditions, price is within tolerance of the band and RSI is in the reset zone, but STH-MVRV at 1.04 says recent buyers are in profit, so this is not yet a dip. The alert arms when the drawdown closes to within 25% of the high.</p>"
    }
  ]
},

recession:{
  name:"Recession Radar", sub:"Credit spreads & curve",
  c:"var(--rec)", hex:"#B8C94A",
  title:"Recession Radar",
  custom:true, custom2:true, tape:["LEAD","48.5"],
  thesis:"Two scores, never one. What is coming, what is already here, and the gap between them — which right now is unusually wide.",
  method:"<b>Why this is split in two.</b> Recession indicators do not share a time horizon, and averaging them into a single number destroys the only information that matters. The yield curve fires 6\u201318 months ahead and is noisy. HY OAS fires at or just before the event and is rarely wrong, rarely early. Collapsing them into one gauge produces a number that is late for one purpose and premature for the other.<br><br><b>On the indicator this tab was built around.</b> HY OAS is an excellent confirmer and a weak predictor. Spreads stay tight until trouble is visible, then widen violently \u2014 they tell you a recession is arriving, not that one is coming. Used as a forecast it produces the classic error: spreads are tight, therefore nothing is wrong. In June 2007 HY OAS sat near 250bp; within eighteen months it passed 900bp. So OAS carries most of the stress score and almost none of the lead score.<br><br><b>Base rate, which almost no recession dashboard states.</b> The US is in recession roughly 15% of months, so a model that always says \"no\" is right 85% of the time. Every lead-time claim here rests on eight recessions since 1976. Precision matters more than recall: calling ten of the last three recessions means sitting in cash through the expansion that pays for everything."
}

  n1:v=>v.toFixed(1), x1:v=>v.toFixed(1)+"x", x2:v=>v.toFixed(2)+"x",
  z:v=>(v>0?"+":"")+v.toFixed(1)+"σ",
  signed:v=>(v>0?"+":"")+v.toFixed(1)+"%",
  ddpct:v=>v.toFixed(0)+"%",
  mult:v=>v.toFixed(1)+"x",
  q:v=>v>=99?"∞":v+"q",
  yr:v=>v+"y",
  // "3th" and "5th" — 1/2/3 need st/nd/rd, and the teens are all "th".
  pctile:v=>{const n=Math.round(v),r=n%100;
    return n+(r>=11&&r<=13?"th":["th","st","nd","rd"][n%10]||"th")},
  gap:v=>(v>0?"+":"")+v.toFixed(1),
  upct:v=>(v>0?"+":"")+v+"%",
  tag:v=>v, txt:v=>v, side:v=>v, cmte:v=>v,
  days:v=>v+"d"
};
const colorFor=(t,v)=>{
  if(t==="z"||t==="signed"||t==="gap"||t==="upct") return v>0?"pos":(v<0?"negv":"");
  if(t==="ddpct") return "negv";
  return "";
};

/* ---------- nav + tape ---------- */
function buildNav(){
  document.getElementById("nav").innerHTML = ORDER.map(k=>{
    const e=ENGINES[k];
    const D=e.data||{state:"none"};
    const tag={live:["LIVE","live"],stale:["STALE","stale"],failed:["NO DATA","failed"],
               missing:["NO DATA","failed"],sample:["SAMPLE","sample"]}[D.state]||["…","none"];
    return `<button style="--c:${e.hex}" data-k="${k}" aria-current="${k===cur}">
      <span class="st st-${tag[1]}">${tag[0]}</span>
      <span class="t">${e.name}</span><span class="s">${e.sub}</span></button>`;
  }).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
    cur=b.dataset.k; sortK="score"; sortDir=-1; minScore=0; q=""; openRow=null;
    buildNav(); render(); window.scrollTo({top:0});
  });
}
function buildTape(){
  document.getElementById("tape").innerHTML = ORDER.map(k=>{
    const e=ENGINES[k]; e.key=k;
    const why={darkpool:"DPI 2.4σ hot, price flat 9 sessions",
               dividend:"Yield 2.3σ above its own 5y median",
               recovery:"3.4x base case, net cash, 12th pctile",
               value:"Market implies 4.2% growth vs 14.8% actual",
               politicians:"Filed 23d after trade, only 2.4% gone",
               bitcoin:"Day 870 of ~1,460 · trough window near",
               recession:"Lead 48.5 vs stress 18.4 — wide gap"}[k];
    const D=e.data;
    if(!showsRows(e)) return `<div class="tp" style="--c:${e.hex}">
      <div class="lbl">${e.name}</div>
      <div class="tk" style="color:var(--dim)">&mdash;<span class="sc" style="color:var(--neg)">no data</span></div>
      <div class="why">${D.state==="failed"?"last run failed or not wired"
        :(D.unreadable?"file unreadable":"no run recorded")}</div></div>`;
    const mark=D.state==="sample"?`<span class="smark">SAMPLE</span>`:"";
    if(e.custom) return `<div class="tp" style="--c:${e.hex}">
      <div class="lbl">${e.name}</div>
      <div class="tk">${e.key==="bitcoin"
        ? `<a href="#" onclick="event.preventDefault();openTk('BTC','Bitcoin','bitcoin')"
             style="color:inherit;text-decoration:none;border-bottom:1px dotted ${e.hex}66">${e.tape[0]}</a>`
        : e.tape[0]}<span class="sc">${e.tape[1]}</span>${mark}</div>
      <div class="why">${why}</div></div>`;
    const top=[...e.rows].sort((a,b)=>b.score-a.score)[0];
    if(!top) return `<div class="tp" style="--c:${e.hex}">
      <div class="lbl">${e.name}</div>
      <div class="tk" style="color:var(--dim)">&mdash;<span class="sc">0 rows</span></div>
      <div class="why">run succeeded · ${ago(D.fileAt)}</div></div>`;
    // The hand-written "why" lines describe the SAMPLE leaders; a live leader
    // gets only what the file actually says about it.
    const w = D.state==="sample" ? why
      : `top of ${e.rows.length} · ${D.state==="stale"?`<span style="color:var(--rc)">${ago(D.fileAt)}</span>`:ago(D.fileAt)}`;
    return `<div class="tp" style="--c:${e.hex}">
      <div class="lbl">${e.name}</div>
      <div class="tk">${top.ticker}<span class="sc">${top.score}</span>${mark}</div>
      <div class="why">${w}</div></div>`;
  }).join("");
}

/* ---------- render ---------- */
function noState(e,k){
  const D=e.data;
  return `<div class="nostate"><h3>No data shown for ${esc(e.name)}.</h3>${esc(D.reason)}
    ${D.detail?`<span class="det">${esc(D.detail)}</span>`:""}
    <span class="det">Status checked ${utc(SRC.statusAt)}. Nothing on this tab is substituted: an empty table is the honest reading of a failed run.</span></div>`;
}
function render(){
  const e=ENGINES[cur];
  document.documentElement.style.setProperty("--acc",e.hex);
  document.getElementById("srcbar").innerHTML=srcBanner(e,cur);

  document.getElementById("head").innerHTML=

       ${e.funnel.built} built, ${e.funnel.data_gated} excluded on data quality,
       ${e.funnel.business_gated} on business gates,
       ${e.funnel.near_miss} scored below the cut \u2014 leaving
       ${e.funnel.passed}. A row count means nothing without it.</p>`:""}
     <div class="method">${e.method}</div></div>`;

  document.getElementById("ctrls").innerHTML=
    `<label class="ctrl">Min score
       <input type="range" min="0" max="95" value="${minScore}" id="ms" style="accent-color:${e.hex}">

     <label class="ctrl">Search

     <span class="pill">Click any row for the full score breakdown</span>`;
  document.getElementById("ms").oninput=ev=>{minScore=+ev.target.value;render()};
  const qi=document.getElementById("qq");
  qi.oninput=ev=>{q=ev.target.value;render();
    const n=document.getElementById("qq");n.focus();n.setSelectionRange(n.value.length,n.value.length)};

  // Single-asset engines (Bitcoin) render as a cycle clock plus gated alert
  // cards rather than a ranked table, so they take their own path.
  const cu=document.getElementById("custom");
  if(e.custom){
    document.getElementById("ctrls").innerHTML="";
    document.getElementById("lb").innerHTML="";
    document.getElementById("thead").innerHTML="";
    document.getElementById("tbody").innerHTML="";
    if(!showsRows(e)){
      cu.innerHTML=noState(e,cur);
      document.getElementById("foot").innerHTML=`<b>Not investment advice.</b>`;
      return;
    }
    cu.classList.toggle("sample",e.data.state==="sample");
    cu.innerHTML=e.custom2?renderRecession(e):renderCycle(e);
    document.getElementById("foot").innerHTML=
      (e.custom2
       ? `<b>Sample data.</b> Spread levels are pinned to real reference points (HY OAS 2.65% on 3 Sep 2026, the 4.61% April 2025 peak,
          the 2.59% January 2025 low); the path between them is generated.
          <br><br><b>FRED now serves only a rolling three-year window</b> for every ICE BofA series, as of April 2026, and points users to
          ICE Data Indices for older history. Percentile ranks on this tab are against three years, not a credit cycle, which is a real
          limitation rather than a rounding detail. Either license the history or start caching the daily prints now and build it forward.`
       : `<b>Sample data.</b> Readings are illustrative and calibrated to the current cycle phase, not a live feed.
       <br><br><b>Three completed cycles is not a sample.</b> Every four-year-cycle claim rests on three observations, and the
       ETF era may have changed the buyer base enough that the prior three no longer generalise. Size accordingly.`)
       + `<br><br><b>Not investment advice.</b>`;
    return;
  }
  cu.innerHTML=""; cu.classList.remove("sample");

  // Members ranked by two-year replicable alpha — only on the politician tab.
  const lbEl=document.getElementById("lb");
  if(e.leaderboard){
    const L=e.leaderboard;
    lbEl.innerHTML=`<div class="lb"><div class="lbh">Tracked members by two-year alpha</div>
      <div class="lbscroll"><div class="lbgrid">
        <div class="lbr hd">${L.head.map(h=>`<span>${h}</span>`).join("")}</div>
        ${L.rows.map(r=>`<div class="lbr">
          <span class="rk num">${r[0]}</span>
          <span class="mn">${r[1]}</span>
          <span class="cm">${r[2]}</span>
          <span class="num pos" style="color:${e.hex}">${r[3]}</span>
          <span class="num pos">${r[4]}</span>
          <span class="num">${r[5]}</span>
          <span class="num">${r[6]}</span>
          <span class="num">${r[7]}</span></div>`).join("")}
      </div></div>
      <div class="lbnote">${L.note}</div></div>`;
  } else lbEl.innerHTML="";

  if(!showsRows(e)){
    document.getElementById("ctrls").innerHTML="";
    lbEl.innerHTML="";
    document.getElementById("thead").innerHTML="";
    document.getElementById("tbody").innerHTML=
      `<tr><td colspan="${e.cols.length}">${noState(e,cur)}</td></tr>`;
    document.getElementById("foot").innerHTML=`<b>Not investment advice.</b> Screens surface candidates for research. They do not replace it.`;
    return;
  }

  document.getElementById("thead").innerHTML="<tr>"+e.cols.map(c=>
    `<th data-k="${c.k}" style="--c:${e.hex}">${c.h}${sortK===c.k?` <span class="ar" style="color:${e.hex}">${sortDir<0?"▼":"▲"}</span>`:""}</th>`
  ).join("")+"</tr>";
  document.querySelectorAll("#thead th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortK===k) sortDir*=-1; else {sortK=k;sortDir=-1;}
    render();
  });

  let rows=e.rows.filter(r=>r.score>=minScore);
  if(q.trim()){const s=q.trim().toLowerCase();
    rows=rows.filter(r=>r.ticker.toLowerCase().includes(s)||r.name.toLowerCase().includes(s));}
  rows.sort((a,b)=>{const x=a[sortK],y=b[sortK];
    return typeof x==="string"?sortDir*x.localeCompare(y):sortDir*(x-y);});

  const tb=document.getElementById("tbody");
  if(!rows.length){tb.innerHTML=`<tr><td colspan="${e.cols.length}"><div class="empty">${
    e.rows.length?"Nothing clears these thresholds. Lower the minimum score or clear the search."
      :`The run succeeded and no name cleared the screen. ${e.data.fileAt?`${cur}.json generated ${utc(e.data.fileAt)}.`:""}`}</div></td></tr>`;return;}
  const isSample=e.data.state==="sample";

  tb.innerHTML=rows.map(r=>{
    const cells=e.cols.map(c=>{
      const v=r[c.k];
      if(c.t==="meter"){
        const on=Math.round(v/10);
        return `<td><span class="meter" style="--c:${e.hex}">${
          Array.from({length:10},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("")
        }</span><span class="scv" style="color:${e.hex}">${v}</span></td>`;
      }
      if(c.t==="tk") return `<td><div class="tk"><a href="#" class="tklink"

        style="color:${e.hex};text-decoration:none;border-bottom:1px dotted ${e.hex}66">${r.ticker}</a>${isSample?`<span class="smark">SAMPLE</span>`:""}</div>
        <div class="co">${r.name}</div></td>`;
      if(c.t==="tag"){
        const cls=v==="Accumulation"?"hot":(v==="Distribution"?"warn":"");
        return `<td><span class="tag ${cls}" style="--c:${e.hex}">${v}</span></td>`;
      }
      if(c.t==="side")
        return `<td><span class="tag ${v==="Buy"?"hot":"warn"}" style="--c:${e.hex}">${v}</span></td>`;
      if(c.t==="cmte")
        return `<td><span class="tag ${v==="Direct"?"hot":""}" style="--c:${e.hex}">${v}</span></td>`;
      if(c.t==="txt") return `<td class="num">${v}</td>`;
      // Filing lag: the closer to the 45-day deadline, the less use it is.
      if(c.t==="days")
        return `<td class="num ${v>=38?"negv":(v<=20?"pos":"")}">${fmt.days(v)}</td>`;
      // A voided field arrives as null. Show it as absent, not as zero — the
      // whole point of voiding was that no value should read as a measurement.
      if(v===null||v===undefined)
        return `<td class="num" style="color:var(--dim)" title="unavailable">&mdash;</td>`;
      return `<td class="num ${colorFor(c.t,v)}">${fmt[c.t](v)}</td>`;
    }).join("");
    const isOpen=openRow===r.ticker;
    let out=`<tr data-t="${r.ticker}" class="${isOpen?"open":""} ${isSample?"samplerow":""}">${cells}</tr>`;
    if(isOpen) out+=detail(r,e);
    return out;
  }).join("");

  document.querySelectorAll("#tbody tr[data-t]").forEach(tr=>tr.onclick=()=>{
    openRow = openRow===tr.dataset.t ? null : tr.dataset.t; render();
  });
  // Symbol opens the detail page; the rest of the row still expands inline.
  document.querySelectorAll("#tbody .tklink").forEach(a=>a.onclick=ev=>{

  document.getElementById("foot").innerHTML= !isSample
    ? `<b>Source.</b> ${cur}.json, generated ${utc(e.data.fileAt)} (${ago(e.data.fileAt)}). Scores are reasoned priors, not a backtest.
       <br><br><b>Not investment advice.</b> Screens surface candidates for research. They do not replace it.`
    : `<b>Sample data.</b> Every number on this page is illustrative and generated for the prototype — it is not live market data and must not be traded on.
     The scoring logic, gates and score decomposition are real and are what the backend implements.
     To go live, point the ingestion layer at FINRA's daily off-exchange short volume files and a fundamentals provider; the two Python modules shipped alongside this file do exactly that.
     ${cur==="politicians"?`<br><br><b>Member names on this tab are invented placeholders.</b> Attaching fabricated performance figures to real, named elected officials would be defamatory, so the prototype uses fictional members. The live version reads real names straight from House and Senate filings, where they are a matter of public record.`:""}
     <br><br><b>Not investment advice.</b> Screens surface candidates for research. They do not replace it.`;
}

/* ---- SVG chart helpers for the Bitcoin page ---------------------------- */
const CH={W:920,X0:48,PAD:16};
const cx=i=>CH.X0+i*((CH.W-CH.X0-CH.PAD)/(BTC.t.length-1));
const at=s=>BTC.t.indexOf(s);
const scal=(v,lo,hi,y0,h)=>y0+h-((v-lo)/(hi-lo))*h;
function line(arr,lo,hi,y0,h,from){
  return arr.map((v,i)=>(v==null||isNaN(v))?null:`${cx(i).toFixed(1)},${scal(v,lo,hi,y0,h).toFixed(1)}`)
            .filter((v,i)=>v&&(from===undefined||i>=from)).join(" ");
}
function xticks(y){
  const marks=["2024-07-07","2025-01-19","2025-07-13","2026-01-11","2026-07-19"];
  return marks.map(m=>{const i=at(m); if(i<0)return"";
    return `<text class="axl" x="${cx(i)}" y="${y}" text-anchor="middle">${m.slice(0,7)}</text>`}).join("");
}

function chartRSI(e){
  const P=BTC.p,R=BTC.rsi,n=P.length;
  const pLo=Math.min(...P)*.93,pHi=Math.max(...P)*1.05;
  const A0=14,AH=150,B0=196,BH=86;              // price panel, RSI panel
  const pushes=["2025-01-19","2025-07-13","2025-10-05"];
  const anchor="2026-02-08", live="2026-04-26";

  const grid=[0,.25,.5,.75,1].map(f=>{
    const y=A0+AH-f*AH, v=Math.round((pLo+f*(pHi-pLo))/1000);
    return `<line class="gl" x1="${CH.X0}" y1="${y}" x2="${CH.W-CH.PAD}" y2="${y}"/>
            <text class="axl" x="${CH.X0-6}" y="${y+3}" text-anchor="end">${v}k</text>`}).join("");
  const rgrid=[30,50,70].map(v=>{
    const y=scal(v,10,95,B0,BH);
    return `<line class="gl" x1="${CH.X0}" y1="${y}" x2="${CH.W-CH.PAD}" y2="${y}"
            ${v!==50?'stroke-dasharray="3 3"':''}/>
            <text class="axl" x="${CH.X0-6}" y="${y+3}" text-anchor="end">${v}</text>`}).join("");

  // Connect the push highs in both panels: price rising, RSI falling = divergence.
  const pp=pushes.map(d=>({x:cx(at(d)),yp:scal(P[at(d)],pLo,pHi,A0,AH),
                           yr:scal(R[at(d)],10,95,B0,BH),p:P[at(d)],r:R[at(d)],d}));
  const conn=(k)=>`<polyline class="dv" stroke="var(--neg)" points="${pp.map(o=>`${o.x},${o[k]}`).join(" ")}"/>`;
  const dots=pp.map((o,i)=>`
    <circle cx="${o.x}" cy="${o.yp}" r="3.5" fill="var(--neg)"/>
    <circle cx="${o.x}" cy="${o.yr}" r="3.5" fill="var(--neg)"/>
    <text class="pin" fill="var(--neg)" x="${o.x}" y="${o.yp-9}" text-anchor="middle">${i+1}</text>
    <text class="pin" fill="var(--neg)" x="${o.x}" y="${o.yr-8}" text-anchor="middle">${o.r.toFixed(0)}</text>`).join("");

  const ai=at(anchor), li=at(live);
  const anchorM=`<circle cx="${cx(ai)}" cy="${scal(R[ai],10,95,B0,BH)}" r="3.5" fill="${e.hex}"/>
    <text class="pin" fill="${e.hex}" x="${cx(ai)}" y="${scal(R[ai],10,95,B0,BH)+13}" text-anchor="middle">${R[ai].toFixed(0)}</text>
    <line class="gl" x1="${cx(ai)}" y1="${A0}" x2="${cx(ai)}" y2="${B0+BH}" stroke="${e.hex}" stroke-dasharray="2 4" opacity=".5"/>`;
  const liveM=`<circle cx="${cx(li)}" cy="${scal(P[li],pLo,pHi,A0,AH)}" r="3.5" fill="${e.hex}"/>
    <text class="pin" fill="${e.hex}" x="${cx(li)}" y="${scal(P[li],pLo,pHi,A0,AH)-9}" text-anchor="middle">1</text>`;

  return `<div class="chart">
    <h4>Weekly price and RSI(14)</h4>
    <div class="cap">The three red markers are the pushes into the October 2025 peak. Price rose 21% across them while
      RSI fell from 90 to 78 — a completed three-drives bearish divergence at the cycle top. The teal line is the
      February 2026 oversold anchor that opened the current sequence.</div>
    <svg viewBox="0 0 ${CH.W} 300" role="img" aria-label="Bitcoin weekly price with RSI divergence markers">
      ${grid}${rgrid}
      <polyline class="pl" stroke="${e.hex}" points="${line(P,pLo,pHi,A0,AH)}"/>
      <polyline class="pl" stroke="var(--mut)" points="${line(R,10,95,B0,BH)}"/>
      ${conn("yp")}${conn("yr")}${dots}${anchorM}${liveM}
      ${xticks(B0+BH+16)}
      <text class="axl" x="${CH.X0}" y="${A0-3}">PRICE (USD)</text>
      <text class="axl" x="${CH.X0}" y="${B0-6}">RSI(14) WEEKLY</text>
    </svg>
    <div class="legend"><span><i style="background:${e.hex}"></i>BTC close</span>
      <span><i style="background:var(--mut)"></i>RSI(14)</span>
      <span><i style="background:var(--neg)"></i>Divergence pushes</span></div>
  </div>`;
}

function chartDaily(e){
  const P=BTCD.p,R=BTCD.r,n=P.length;
  const W=CH.W,X0=CH.X0,PAD=CH.PAD;
  const dx=i=>X0+i*((W-X0-PAD)/(n-1));
  const pLo=Math.min(...P)*.94,pHi=Math.max(...P)*1.04;
  const A0=14,AH=132,B0=182,BH=96;
  const sy=(v,lo,hi,y0,h)=>y0+h-((v-lo)/(hi-lo))*h;
  const pl=(a,lo,hi,y0,h)=>a.map((v,i)=>`${dx(i).toFixed(1)},${sy(v,lo,hi,y0,h).toFixed(1)}`).join(" ");
  const iof=t=>BTCD.t.indexOf(t);

  const grid=[0,.5,1].map(f=>{const y=A0+AH-f*AH,v=Math.round((pLo+f*(pHi-pLo))/1000);
    return `<line class="gl" x1="${X0}" y1="${y}" x2="${W-PAD}" y2="${y}"/>
      <text class="axl" x="${X0-6}" y="${y+3}" text-anchor="end">${v}k</text>`}).join("");

  // Cardwell bear-market band: RSI lives roughly 20-60 in a downtrend, so 30 is
  // the oversold line here and 65 acts as resistance. Both shift up in a bull.
  const bandY0=sy(60,10,90,B0,BH), bandY1=sy(20,10,90,B0,BH);
  const cband=`<rect x="${X0}" y="${bandY0}" width="${W-PAD-X0}" height="${bandY1-bandY0}"
      fill="${e.hex}" opacity=".07"/>`;
  const rg=[30,50,65].map(v=>{const y=sy(v,10,90,B0,BH);
    return `<line class="gl" x1="${X0}" y1="${y}" x2="${W-PAD}" y2="${y}"
      ${v===30?'stroke="var(--dv)" stroke-width="1.3"':'stroke-dasharray="3 3"'}/>
      <text class="axl" x="${X0-6}" y="${y+3}" text-anchor="end">${v}</text>`}).join("");

  // Oversold episodes and their 30-day forward outcome.
  const ep=[["2025-11-01",-14.7],["2025-11-30",2.1],["2025-12-17",7.8],
            ["2026-02-06",20.9],["2026-03-25",23.7],["2026-06-05",5.0],["2026-06-26",20.5]];
  const dots=ep.map(([t,f])=>{const i=iof(t); if(i<0)return"";
    const c=f>0?"var(--dv)":"var(--neg)";
    return `<circle cx="${dx(i)}" cy="${sy(R[i],10,90,B0,BH)}" r="3.4" fill="${c}"/>
      <text class="pin" fill="${c}" x="${dx(i)}" y="${sy(P[i],pLo,pHi,A0,AH)-8}"
        text-anchor="middle">${f>0?"+":""}${f}</text>
      <circle cx="${dx(i)}" cy="${sy(P[i],pLo,pHi,A0,AH)}" r="2.6" fill="${c}"/>`}).join("");

  // The June bullish divergence: price lower low, RSI higher low.

      <span><i style="background:var(--mut)"></i>RSI(14)</span>

function chartDip(e){
  const P=BTC.p,S=BTC.sma,E=BTC.ema,M=BTC.mvrv;
  const pLo=Math.min(...P)*.93,pHi=Math.max(...P)*1.05;
  const A0=14,AH=158,B0=204,BH=78;
  const f=S.findIndex(v=>v!=null&&!isNaN(v));

  const grid=[0,.25,.5,.75,1].map(k=>{
    const y=A0+AH-k*AH,v=Math.round((pLo+k*(pHi-pLo))/1000);
    return `<line class="gl" x1="${CH.X0}" y1="${y}" x2="${CH.W-CH.PAD}" y2="${y}"/>
            <text class="axl" x="${CH.X0-6}" y="${y+3}" text-anchor="end">${v}k</text>`}).join("");

  // Band = area between the 20W SMA and 21W EMA.
  const up=[],dn=[];
  for(let i=f;i<P.length;i++){
    up.push(`${cx(i).toFixed(1)},${scal(Math.max(S[i],E[i]),pLo,pHi,A0,AH).toFixed(1)}`);
    dn.push(`${cx(i).toFixed(1)},${scal(Math.min(S[i],E[i]),pLo,pHi,A0,AH).toFixed(1)}`);
  }
  const band=`<polygon points="${up.concat(dn.reverse()).join(" ")}" fill="${e.hex}" opacity=".18"/>`;

  const mLo=.72,mHi=1.5, y1=scal(1,mLo,mHi,B0,BH);
  const mgrid=[.8,1.0,1.2,1.4].map(v=>{const y=scal(v,mLo,mHi,B0,BH);
    return `<line class="gl" x1="${CH.X0}" y1="${y}" x2="${CH.W-CH.PAD}" y2="${y}"
      ${v===1?`stroke="var(--dv)" stroke-width="1.4"`:'stroke-dasharray="3 3"'}/>
      <text class="axl" x="${CH.X0-6}" y="${y+3}" text-anchor="end">${v.toFixed(1)}</text>`}).join("");
  const under=`<rect x="${CH.X0}" y="${y1}" width="${CH.W-CH.PAD-CH.X0}" height="${B0+BH-y1}" class="zone"/>`;

  // Historical instances where price sat on the band with STH-MVRV at or under 1.
  const hits=["2024-08-11","2024-10-06","2025-04-06"].map(d=>{const i=at(d);
    return `<circle cx="${cx(i)}" cy="${scal(P[i],pLo,pHi,A0,AH)}" r="4"
      fill="none" stroke="var(--dv)" stroke-width="1.8"/>`}).join("");

  return `<div class="chart">
    <h4>Support band and short-term holder MVRV</h4>
    <div class="cap">The shaded band is the 20-week SMA / 21-week EMA. Green circles mark the three historical dips
      where price sat on the band while STH-MVRV was at or below 1.0 — the confluence the rule looks for. The red
      region below 1.0 is where the average buyer of the last 155 days is underwater.</div>
    <svg viewBox="0 0 ${CH.W} 300" role="img" aria-label="Bitcoin support band and short-term holder MVRV">
      ${grid}${band}
      <polyline class="pl" stroke="${e.hex}" points="${line(P,pLo,pHi,A0,AH)}"/>
      <polyline class="pl" stroke="var(--mut)" stroke-width="1" points="${line(S,pLo,pHi,A0,AH,f)}"/>
      ${hits}${under}${mgrid}
      <polyline class="pl" stroke="var(--dv)" points="${line(M,mLo,mHi,B0,BH,f)}"/>
      ${xticks(B0+BH+16)}
      <text class="axl" x="${CH.X0}" y="${A0-3}">PRICE + SUPPORT BAND</text>
      <text class="axl" x="${CH.X0}" y="${B0-6}">STH-MVRV</text>
    </svg>
    <div class="legend"><span><i style="background:${e.hex}"></i>BTC close</span>
      <span><i style="background:${e.hex};opacity:.4"></i>20W SMA / 21W EMA band</span>
      <span><i style="background:var(--dv)"></i>STH-MVRV</span>
      <span><i style="background:var(--neg);opacity:.5"></i>Recent buyers underwater</span></div>
  </div>`;
}

function chartOAS(e){
  const T=OAS.t,H=OAS.hy,n=T.length,W=CH.W,X0=56,PAD=CH.PAD;
  const dx=i=>X0+i*((W-X0-PAD)/(n-1));
  const A0=16,AH=210, lo=1.8, hi=11.0;              // log-ish range in pp
  const sy=v=>A0+AH-((Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo)))*AH;
  const pl=a=>a.map((v,i)=>`${dx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" ");

  // Level bands are the interpretive frame; the line alone means little.
  const bands=[[1.8,3,"complacent","var(--dv)"],[3,4,"normal","var(--mut)"],
               [4,5,"caution",e.hex],[5,7,"stress","var(--rc)"],[7,11,"severe","var(--neg)"]];
  const rects=bands.map(([a,b,l,c])=>`
    <rect x="${X0}" y="${sy(b)}" width="${W-PAD-X0}" height="${sy(a)-sy(b)}"
      fill="${c}" opacity=".05"/>
    <line class="gl" x1="${X0}" y1="${sy(a)}" x2="${W-PAD}" y2="${sy(a)}" stroke-dasharray="2 4"/>
    <text class="axl" x="${X0-6}" y="${sy(a)+3}" text-anchor="end">${a}%</text>
    <text class="axl" x="${W-PAD-4}" y="${sy(b)+12}" text-anchor="end" fill="${c}" opacity=".75">${l}</text>`).join("");

  const cur=H[n-1], iMax=H.indexOf(Math.max(...H));
  const tk=["2024-01-05","2024-07-05","2025-01-03","2025-07-04","2026-01-02","2026-07-03"]
    .map(t=>{let i=T.indexOf(t); if(i<0)i=T.findIndex(x=>x>=t); return i<0?"":
      `<text class="axl" x="${dx(i)}" y="${A0+AH+16}" text-anchor="middle">${t.slice(0,7)}</text>`}).join("");

  return `<div class="chart">
    <h4>ICE BofA US High Yield OAS</h4>
    <div class="cap">Three years is the whole window FRED now serves for this series. The April 2025 spike to 4.61% is the
      only episode in it that reached the caution band, and it round-tripped within ten weeks. At 2.65% the index sits in
      the 8th percentile of even this short window \u2014 credit is pricing close to no stress at all.</div>

      <text class="pin" fill="var(--rc)" x="${dx(iMax)}" y="${sy(H[iMax])-9}" text-anchor="middle">${H[iMax]}%</text>

  </div>`;
}

/* ==========================================================
   TICKER DETAIL PAGE
   Values are derived deterministically from the ticker string so every
   symbol opens a stable, varied page without hand-authoring ~110 of them.
   Sample only — the live version fills these from the engines.
   ========================================================== */
function seed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}

function tkDetail(sym,name,eng){
  const r=seed(sym), px=+(18+r()*380).toFixed(2), fv=+(px*(1.15+r()*0.55)).toFixed(2);
  const sup=[fv*0.86,fv*0.76,fv*0.63,fv*0.55].map(v=>+v.toFixed(2));
  const tiers=[["good",.12],["great",.22],["fantastic",.38]].map(([t,d])=>{
    const tgt=fv*(1-d), a=sup.find(x=>x<=tgt*1.03)||tgt;
    return {t,p:+a.toFixed(2),pct:+((a/px-1)*100).toFixed(1),d:d*100,
            reached:px<=a, anchor:sup.includes(+a.toFixed(2))?"prior base":"fair-value discount"};
  });
  const solvency=r()>0.25, insider=r()>0.6, rev=+(-14+r()*20).toFixed(1);
  const confirmed=solvency&&(insider||rev>-5);

  const rsiV=+(28+r()*50).toFixed(1), macdH=+(-1.4+r()*2.8).toFixed(3),
        srk=+(r()).toFixed(2), z=+(-2.4+r()*4.6).toFixed(2);
  const obvStates=["confirming","bearish divergence","bullish divergence"];
  const obvS=obvStates[Math.floor(r()*3)], obvT=r()>0.5?"accumulation":"distribution";
  const eff=2+Math.floor(r()*2);

  const inEng=ORDER.filter(k=>!ENGINES[k].custom&&(ENGINES[k].rows||[]).some(x=>x.ticker===sym));
  const flags=inEng.map(k=>`<span class="flag" style="color:${ENGINES[k].hex};border-color:${ENGINES[k].hex}">${ENGINES[k].name}</span>`).join("")
    || `<span class="flag" style="color:var(--dim);border-color:var(--line2)">No engine currently flags this</span>`;

  const row=(ENGINES[eng].rows||[]).find(x=>x.ticker===sym)||{};
  const thesis=row.note||"<p>No engine narrative available for this symbol in the sample data.</p>";

  const bullT=[["Valuation","Multiple re-rates toward the 10-year median as the estimate cut cycle ends"],
               ["Operational","Two consecutive quarters of positive estimate revisions"],
               ["Flow","Off-exchange accumulation persists with price flat — see the Dark Pool tab"],

// ------------------------------------------------------------- provenance
// Every tab carries one of these states, and every surface that shows a number
// reads it. The old boot() fell back to the embedded sample SILENTLY whenever a
// run failed or a status entry was missing, so invented rows (OGN 8.94%, LYB
// 6.84%) rendered on the live site indistinguishable from real ones.
//
//   live     the run succeeded and its file is fresh
//   stale    the run succeeded but the file is older than the engine's cadence
//   failed   the last run errored, or is not wired — nothing is shown
//   missing  no run recorded, or the file the status points at is absent
//   sample   status.json is unreachable (cold-start demo) or the tab's renderer
//            does not read its file yet — shown ONLY under a persistent banner
//
// Stale is judged against how often the engine is meant to run. Daily engines
// get a day and a half; weekly screeners eight days.
const CADENCE_H={darkpool:36,politicians:36,bitcoin:36,recession:36,
                 dividend:192,recovery:192,value:192,financial:192};
// Tabs whose renderer still draws from constants embedded in this file. Their
// JSON is written by a successful run and NOT read here, so until the charts
// are wired to it they are sample by construction, whatever status.json says.
const RENDERER_UNWIRED={bitcoin:true,recession:true};

const SRC={reachable:false, statusAt:null};
ORDER.forEach(k=>{ENGINES[k].data={state:"sample",reason:"",detail:"",fileAt:null,statusAt:null};
                  ENGINES[k].sampleRows=ENGINES[k].rows;
                  ENGINES[k].leaderboardShape=ENGINES[k].leaderboard;});

const utc=iso=>{ if(!iso) return "unknown time";
  const d=new Date(iso); if(isNaN(d)) return iso;
  return d.toLocaleString("en-GB",{timeZone:"UTC",day:"numeric",month:"short",year:"numeric",
    hour:"2-digit",minute:"2-digit",hour12:false})+" UTC"; };
const ago=iso=>{ if(!iso) return "";
  const h=(Date.now()-new Date(iso))/36e5;
  if(!isFinite(h)) return "";
  return h<1?`${Math.max(1,Math.round(h*60))}m old`:(h<48?`${h.toFixed(1)}h old`:`${(h/24).toFixed(1)} days old`); };
const lastLine=t=>(t||"").trim().split("\n").filter(Boolean).pop()||"";
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadEngine(k,s){
  const e=ENGINES[k], D=e.data, st=s.engines?.[k];
  D.statusAt=st?.at||s.updated_at;
  // One engine's bad file must never take down another tab. bitcoin.json once
  // carried bare NaN tokens, the parse threw inside a shared Promise.all, and
  // every tab on the live site fell back to sample.
  let file=null, fileErr="";
  try{ const r=await fetch(`data/${k}.json`,{cache:"no-store"});
       if(r.ok){ const txt=await r.text();
         try{ file=JSON.parse(txt); }catch(pe){ fileErr=`${k}.json is not valid JSON (${pe.message.slice(0,90)}).`; } }
       else fileErr=`${k}.json returned HTTP ${r.status}.`;
  }catch(fe){ fileErr=`${k}.json could not be fetched (${fe}).`; }
  D.fileAt=file?.generated_at||null;

  // Live mode never shows the embedded rows or funnel on a table tab. Whatever
  // is displayed below comes from the file, or nothing is displayed.
  if(!e.custom){ e.rows=[]; delete e.funnel; delete e.leaderboard; }

  if(!st){
    D.state="missing";
    D.reason=`No run of this engine is recorded in status.json (updated ${utc(s.updated_at)}).`;
    if(file) D.detail=`An older ${k}.json from ${utc(D.fileAt)} exists and is not shown: nothing records that the run which wrote it succeeded.`;
    return;
  }
  if(st.state==="not_wired"){
    D.state="failed"; D.reason=`${k}.json not written — this engine is not wired to a data source.`;
    D.detail=st.detail||""; return;
  }
  if(st.state==="skipped"){
    D.state="missing";
    D.reason=`${k} has not run yet — it runs on a ${st.cadence||"weekly"} cadence and no run is recorded.`;
    return;
  }
  // A carried entry is the engine's LAST outcome, from a run before the
  // latest one. Saying "failed at <latest run time>" misdated a Sunday crash
  // as a Monday one, against code that had since been fixed.
  const notRun = st.carried ? ` It did not run in the latest run (${utc(s.updated_at)}); this is its last recorded result.` : "";
  if(st.state!=="ok"){
    D.state="failed";
    D.reason=`${k}.json not written — its last run failed at ${utc(st.at||s.updated_at)}.${notRun}`;
    D.detail=lastLine(st.detail)+(file?`\n\nAn older ${k}.json from ${utc(D.fileAt)} (${ago(D.fileAt)}) exists and is deliberately not shown: the run that should have replaced it failed.`:"");
    return;
  }
  if(!file){
    D.state="missing"; D.unreadable=true;
    D.reason=`status.json records a successful run at ${utc(st.at)}, but ${fileErr||`${k}.json could not be read.`}`;
    return;
  }
  if(RENDERER_UNWIRED[k]){
    D.state="sample";
    D.reason=`${k}.json was written ${utc(D.fileAt)} (${ago(D.fileAt)}), but this tab's charts and readings are not yet wired to it. Everything below is embedded sample data.`;
    return;
  }
  if(!e.custom){
    e.rows=Array.isArray(file.rows)?file.rows:[];
    if(file.funnel) e.funnel=file.funnel;
    if(file.leaderboard) e.leaderboard={...(e.leaderboardShape||{}),rows:file.leaderboard};
  }
  const ageH=(Date.now()-new Date(D.fileAt))/36e5;
  D.state = ageH>(CADENCE_H[k]||36) ? "stale" : "live";
  if(D.state==="stale")
    D.reason=`${k}.json is ${ago(D.fileAt)} — older than this engine's ${CADENCE_H[k]>36?"weekly":"daily"} cadence allows. The rows are real but not current.`;
}

async function boot(){
  try{
    const st=await fetch("data/status.json",{cache:"no-store"});
    if(!st.ok) throw new Error(`status.json HTTP ${st.status}`);
    const s=await st.json();
    SRC.reachable=true; SRC.statusAt=s.updated_at;
    await Promise.all(ORDER.map(k=>loadEngine(k,s)));
  }catch(err){
    // Cold-start demo only. Every tab is marked, every row is marked.
    SRC.reachable=false;
    ORDER.forEach(k=>{const D=ENGINES[k].data; D.state="sample";
      D.reason="data/status.json could not be loaded, so this page is showing the embedded demo. None of these figures are real.";
      D.detail=String(err);});
  }
  const n=ORDER.filter(k=>["live","stale"].includes(ENGINES[k].data.state)).length;
  document.getElementById("railsrc").innerHTML = SRC.reachable
    ? `<b style="color:var(--txt)">${n} of ${ORDER.length} tabs</b> show data from a successful run. status.json updated ${utc(SRC.statusAt)} (${ago(SRC.statusAt)}).`
    : `<b style="color:#FF8A95">Demo mode.</b> No data files loaded — every figure is invented.`;
  buildNav(); buildTape(); render();
}

// The banner every tab carries, at the top of the tab itself.
function srcBanner(e,k){
  const D=e.data;
  const label={live:"LIVE",stale:"STALE",failed:"NO DATA",missing:"NO DATA",sample:"SAMPLE — NOT REAL"}[D.state];
  const cls={live:"live",stale:"stale",failed:"failed",missing:"failed",sample:"sample"}[D.state];
  const body = D.state==="live"
    ? `From <b>${k}.json</b>, generated ${utc(D.fileAt)} (${ago(D.fileAt)}).`
    : esc(D.reason);
  const age = D.fileAt && D.state!=="live"
    ? `<span class="det">${k}.json generated ${utc(D.fileAt)} · ${ago(D.fileAt)}</span>`
    : (D.state==="live"||D.fileAt?"":`<span class="det">${k}.json: no file · status checked ${utc(SRC.statusAt)}</span>`);
  return `<div class="srcban ${cls}"><b class="k">${label}</b>${body}
    ${D.detail&&D.state!=="live"?`<span class="det">${esc(D.detail)}</span>`:""}${age}</div>`;
}
const showsRows=e=>["live","stale","sample"].includes(e.data.state);

let LIVE=null;
boot();
</script>
</body>
</html>
